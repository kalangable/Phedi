spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:phedi}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
          batch_size: 20
        order_inserts: true
        order_updates: true

  liquibase:
    enabled: true
    # O asterisco (*) força o Spring a buscar em todos os JARs do classpath, incluindo o phedi-core
    change-log: classpath*:db/changelog/db.changelog-master.xml

  data:
    jpa:
      repositories:
        enabled: true

logging:
  level:
    root: INFO
    com.phedi: INFO
    liquibase: INFO
